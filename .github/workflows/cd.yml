name: CD

on:
  push:
    branches:
      - main
permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    if: ${{ vars.ENABLE_SSH_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      EC2_SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
      DEPLOY_HEALTHCHECK_URL: ${{ vars.DEPLOY_HEALTHCHECK_URL || secrets.DEPLOY_HEALTHCHECK_URL }}
      DEPLOY_HOLD_TTL_SECONDS: ${{ vars.DEPLOY_HOLD_TTL_SECONDS || '10' }}
    steps:
      - name: Validate deployment configuration
        env:
          ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -n "$ACCESS_KEY" || { echo 'Missing AWS_ACCESS_KEY_ID secret'; exit 1; }
          test -n "$SECRET_KEY" || { echo 'Missing AWS_SECRET_ACCESS_KEY secret'; exit 1; }
          test -n "$AWS_REGION" || { echo 'Missing AWS_REGION variable'; exit 1; }
          test -n "$EC2_INSTANCE_ID" || { echo 'Missing EC2_INSTANCE_ID variable'; exit 1; }
          test -n "$EC2_SECURITY_GROUP_ID" || { echo 'Missing EC2_SECURITY_GROUP_ID variable'; exit 1; }
          test -n "$DEPLOY_HEALTHCHECK_URL" || { echo 'Missing DEPLOY_HEALTHCHECK_URL variable'; exit 1; }
          test "$DEPLOY_HOLD_TTL_SECONDS" -gt 0 || { echo 'DEPLOY_HOLD_TTL_SECONDS must be positive'; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: '887095767284'

      - name: Discover target and runner network
        id: target
        run: |
          set -euo pipefail
          runner_cidr="$(curl --fail --silent --show-error https://checkip.amazonaws.com)/32"
          public_ip="$(aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)"
          availability_zone="$(aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].Placement.AvailabilityZone' \
            --output text)"
          test -n "$public_ip" && test "$public_ip" != 'None'
          test -n "$availability_zone" && test "$availability_zone" != 'None'
          echo "runner_cidr=$runner_cidr" >> "$GITHUB_OUTPUT"
          echo "public_ip=$public_ip" >> "$GITHUB_OUTPUT"
          echo "availability_zone=$availability_zone" >> "$GITHUB_OUTPUT"

      - name: Temporarily allow this runner to use SSH
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 22 \
            --cidr '${{ steps.target.outputs.runner_cidr }}'

      - name: Deploy with a temporary EC2 Instance Connect key
        env:
          PUBLIC_IP: ${{ steps.target.outputs.public_ip }}
          AVAILABILITY_ZONE: ${{ steps.target.outputs.availability_zone }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/cinemaseat-deploy"
          ssh-keygen -q -t ed25519 -N '' -f "$key_path"
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id "$EC2_INSTANCE_ID" \
            --availability-zone "$AVAILABILITY_ZONE" \
            --instance-os-user ec2-user \
            --ssh-public-key "file://$key_path.pub"
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            -i "$key_path" \
            "ec2-user@$PUBLIC_IP" \
            "DEPLOY_HOLD_TTL_SECONDS='$DEPLOY_HOLD_TTL_SECONDS' bash -s" <<'REMOTE'
          set -euo pipefail
          sudo git -C /opt/cinemaseat fetch origin main
          sudo git -C /opt/cinemaseat checkout main
          sudo git -C /opt/cinemaseat pull --ff-only origin main
          cd /opt/cinemaseat
          sudo docker compose pull
          sudo env HOLD_TTL_SECONDS="$DEPLOY_HOLD_TTL_SECONDS" docker compose up -d --build --remove-orphans
          sudo docker compose ps
          REMOTE

      - name: Verify the public deployment
        run: |
          curl --fail --silent --show-error \
            --retry 18 --retry-delay 5 --retry-all-errors \
            "$DEPLOY_HEALTHCHECK_URL"

      - name: Remove temporary SSH access
        if: ${{ always() }}
        env:
          RUNNER_CIDR: ${{ steps.target.outputs.runner_cidr }}
        run: |
          if [ -n "$RUNNER_CIDR" ]; then
            aws ec2 revoke-security-group-ingress \
              --group-id "$EC2_SECURITY_GROUP_ID" \
              --protocol tcp \
              --port 22 \
              --cidr "$RUNNER_CIDR" || true
          fi
